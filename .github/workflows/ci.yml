name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check
        run: python3 -m py_compile server.py
      - name: JS syntax check
        run: |
          for f in static/js/*.js; do
            node --check "$f" || exit 1
          done

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sets up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: API smoke + stress test
        run: python3 tests/smoke.py --stress
      - name: Asset size budget (uncompressed < 700 KB)
        run: |
          total=$(find static -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' -o -name '*.woff2' \) -printf '%s\n' | awk '{s+=$1} END {print s}')
          echo "static assets: $((total/1024)) KB"
          test "$total" -lt 716800
