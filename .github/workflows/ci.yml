name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check
        run: python3 -m py_compile server.py
      - name: JS syntax check
        run: |
          for f in static/js/*.js; do
            node --check "$f" || exit 1
          done
      - name: Python lint (ruff)
        run: |
          pipx run ruff check server.py tests/
      - name: Python unit tests
        run: python3 tests/test_unit.py
      - name: Date/recurrence unit tests
        run: node tests/js/recurrence.test.js

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sets up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: API smoke + stress test
        run: python3 tests/smoke.py --stress
      # 850 KB: assets grew ~42% from v1.6.0 (565 KB) to v1.9.0 (~785 KB) —
      # PWA/offline, ambient canvas engine, musik dunia, kalender, i18n.
      - name: Asset size budget (uncompressed < 850 KB)
        run: |
          total=$(find static -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' -o -name '*.woff2' \) -printf '%s\n' | awk '{s+=$1} END {print s}')
          echo "static assets: $((total/1024)) KB"
          test "$total" -lt 870400

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run E2E (Chromium)
        run: npm run test:e2e
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
