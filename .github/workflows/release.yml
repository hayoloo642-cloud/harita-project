name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: python -m pip install --user pyinstaller
      - name: Install Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm curl
          curl -L -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
      - name: Build Linux binary
        if: matrix.os == 'ubuntu-latest'
        run: |
          APPIMAGETOOL=/tmp/appimagetool sh packaging/build-linux.sh
          version=$(sed -n 's/^__version__ = "\([^"]*\)".*$/\1/p' server.py)
          mv dist/Harita "dist/harita-${version}-linux-x86_64"
      - name: Build macOS binary
        if: matrix.os == 'macos-latest'
        run: |
          sh packaging/build-macos.sh
          version=$(sed -n 's/^__version__ = "\([^"]*\)".*$/\1/p' server.py)
          mv dist/Harita "dist/harita-${version}-macos-arm64"
          if [ -d dist/Harita.app ]; then ditto -c -k --sequesterRsrc --keepParent dist/Harita.app "dist/harita-${version}-macos-arm64.app.zip"; rm -rf dist/Harita.app; fi
          [ -f dist/Harita.dmg ] && mv dist/Harita.dmg "dist/harita-${version}-macos-arm64.dmg" || true
      - name: Build Windows binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\packaging\build-windows.bat
      - name: Install Inno Setup
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\packaging\windows\build-installer.ps1
      - name: Rename Windows portable binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Select-String -Path server.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          Move-Item dist\Harita.exe "dist\harita-$version-windows-x86_64.exe"
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  build-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build source archive
        run: sh packaging/build-source.sh
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/harita-*-source.zip*
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-binaries, build-source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: source
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes="See CHANGELOG.md for details. Binaries are unsigned; macOS may require right-click → Open, and Windows may show SmartScreen."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* source/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" artifacts/* source/* --repo "$GITHUB_REPOSITORY" --title "Harita $tag" --notes "$notes"
          fi
